<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Clientexec registrar development workflow</title>
  <desc id="desc">A four-stage overview covering planning and approval, the repeatable implementation loop, test outcomes, and final release.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .stage { font: 700 17px Arial, sans-serif; letter-spacing: 1px; fill: #334155; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 400 15px Arial, sans-serif; fill: #475569; }
      .result-title { font: 700 18px Arial, sans-serif; }
      .result-copy { font: 400 15px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="1598" height="918" rx="23" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="62" class="title">Development Workflow</text>
  <text x="70" y="94" class="subtitle">Plan once, then repeat the evidence, implementation, and verification loop for every approved capability.</text>

  <rect x="50" y="125" width="1500" height="210" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="78" y="158" class="stage">1  PLAN AND APPROVE</text>

  <g>
    <rect x="80" y="185" width="250" height="110" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="205" y="222" text-anchor="middle" class="box-title">Review evidence</text>
    <text x="205" y="250" text-anchor="middle" class="box-copy">Registrar and Clientexec sources</text>
    <text x="205" y="272" text-anchor="middle" class="box-copy">classified and gaps identified</text>

    <rect x="380" y="185" width="250" height="110" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="505" y="222" text-anchor="middle" class="box-title">Confirm identity</text>
    <text x="505" y="250" text-anchor="middle" class="box-copy">Name, plugin ID, metadata,</text>
    <text x="505" y="272" text-anchor="middle" class="box-copy">target versions, and sandbox</text>

    <rect x="680" y="185" width="250" height="110" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="805" y="222" text-anchor="middle" class="box-title">Inventory capabilities</text>
    <text x="805" y="250" text-anchor="middle" class="box-copy">Compare registrar features</text>
    <text x="805" y="272" text-anchor="middle" class="box-copy">with Clientexec support</text>

    <rect x="980" y="185" width="250" height="110" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1105" y="222" text-anchor="middle" class="box-title">Prepare phase plan</text>
    <text x="1105" y="250" text-anchor="middle" class="box-copy">Dependencies, tests, blockers,</text>
    <text x="1105" y="272" text-anchor="middle" class="box-copy">and unsupported limitations</text>

    <rect x="1280" y="185" width="240" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="1400" y="222" text-anchor="middle" class="box-title">Kit-user approval</text>
    <text x="1400" y="250" text-anchor="middle" class="box-copy">Resolve decisions and</text>
    <text x="1400" y="272" text-anchor="middle" class="box-copy">blocking unknowns</text>

    <path d="M330 240 H372" class="arrow"/>
    <path d="M630 240 H672" class="arrow"/>
    <path d="M930 240 H972" class="arrow"/>
    <path d="M1230 240 H1272" class="arrow"/>
  </g>

  <rect x="50" y="365" width="1500" height="220" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="78" y="398" class="stage">2  REPEAT FOR EACH ELIGIBLE PHASE</text>

  <g>
    <rect x="85" y="430" width="245" height="110" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="207" y="467" text-anchor="middle" class="box-title">Evidence Gate</text>
    <text x="207" y="495" text-anchor="middle" class="box-copy">Recheck contracts, permissions,</text>
    <text x="207" y="517" text-anchor="middle" class="box-copy">dependencies, and tests</text>

    <rect x="380" y="430" width="245" height="110" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="502" y="467" text-anchor="middle" class="box-title">Implement one phase</text>
    <text x="502" y="495" text-anchor="middle" class="box-copy">Keep unrelated and unverified</text>
    <text x="502" y="517" text-anchor="middle" class="box-copy">capabilities disabled</text>

    <rect x="675" y="430" width="245" height="110" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="797" y="467" text-anchor="middle" class="box-title">Validate locally</text>
    <text x="797" y="495" text-anchor="middle" class="box-copy">Syntax, mapping, failures,</text>
    <text x="797" y="517" text-anchor="middle" class="box-copy">security, and code quality</text>

    <rect x="970" y="430" width="245" height="110" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1092" y="467" text-anchor="middle" class="box-title">Record awaiting test</text>
    <text x="1092" y="495" text-anchor="middle" class="box-copy">Append the local result to</text>
    <text x="1092" y="517" text-anchor="middle" class="box-copy">the development changelog</text>

    <rect x="1265" y="430" width="245" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1387" y="467" text-anchor="middle" class="box-title">Kit-user test</text>
    <text x="1387" y="495" text-anchor="middle" class="box-copy">Clientexec staging or</text>
    <text x="1387" y="517" text-anchor="middle" class="box-copy">registrar sandbox</text>

    <path d="M330 485 H372" class="arrow"/>
    <path d="M625 485 H667" class="arrow"/>
    <path d="M920 485 H962" class="arrow"/>
    <path d="M1215 485 H1257" class="arrow"/>
  </g>

  <text x="70" y="625" class="stage">3  RECORD THE PHASE RESULT</text>

  <g>
    <rect x="70" y="650" width="455" height="120" rx="16" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="686" class="result-title" fill="#166534">PASSED</text>
    <text x="100" y="716" class="result-copy">Enable the approved capability and record the result.</text>
    <text x="100" y="742" class="result-copy">Dependent work may continue.</text>

    <rect x="572" y="650" width="455" height="120" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="602" y="686" class="result-title" fill="#991b1b">FAILED</text>
    <text x="602" y="716" class="result-copy">Keep disabled, record the failure, and return to implementation.</text>
    <text x="602" y="742" class="result-copy">Dependent work remains blocked.</text>

    <rect x="1075" y="650" width="455" height="120" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="1105" y="686" class="result-title" fill="#92400e">SKIPPED</text>
    <text x="1105" y="716" class="result-copy">Warn, mark unverified, keep disabled, and record the reason.</text>
    <text x="1105" y="742" class="result-copy">Only independent work may continue.</text>
  </g>

  <rect x="50" y="810" width="1500" height="70" rx="18" fill="#0f172a"/>
  <text x="95" y="852" class="stage" style="fill:#e2e8f0">4  COMPLETE</text>
  <text x="310" y="852" class="box-title" style="fill:#ffffff">Final reconciliation</text>
  <text x="540" y="852" class="box-title" style="fill:#94a3b8">→</text>
  <text x="585" y="852" class="box-title" style="fill:#ffffff">Clean-install validation</text>
  <text x="850" y="852" class="box-title" style="fill:#94a3b8">→</text>
  <text x="895" y="852" class="box-title" style="fill:#ffffff">Package inspection</text>
  <text x="1115" y="852" class="box-title" style="fill:#94a3b8">→</text>
  <text x="1160" y="852" class="box-title" style="fill:#ffffff">Release</text>
</svg>
